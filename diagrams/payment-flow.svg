<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', Courier, monospace">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#484f58"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3fb950"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="#0d1117"/>
  <!-- top accent line -->
  <rect width="1200" height="3" fill="#388bfd"/>

  <!-- title -->
  <text x="600" y="44" text-anchor="middle" fill="#e6edf3" font-size="17">circle payment flow</text>

  <!-- user input label -->
  <text x="500" y="64" text-anchor="middle" fill="#7d8590" font-size="12">"send 50 usdc to jack"</text>

  <!-- BOX 1: create_payment -->
  <rect x="350" y="72" width="300" height="50" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="500" y="102" text-anchor="middle" fill="#e6edf3" font-size="14">create_payment</text>

  <!-- arrow 1 to 2 -->
  <line x1="500" y1="122" x2="500" y2="150" stroke="#484f58" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- BOX 2: prepare() -->
  <rect x="350" y="153" width="300" height="82" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="500" y="178" text-anchor="middle" fill="#e6edf3" font-size="14">prepare()</text>
  <text x="500" y="198" text-anchor="middle" fill="#7d8590" font-size="11">resolve vendor  ·  check wallet</text>
  <text x="500" y="216" text-anchor="middle" fill="#7d8590" font-size="11">store pending payment</text>

  <!-- arrow 2 to 3 -->
  <line x1="500" y1="235" x2="500" y2="263" stroke="#484f58" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- BOX 3: confirm / cancel (blue accent - human checkpoint) -->
  <rect x="350" y="266" width="300" height="66" rx="6" fill="#0d2137" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="500" y="291" text-anchor="middle" fill="#e6edf3" font-size="14">confirm / cancel card</text>
  <text x="500" y="313" text-anchor="middle" fill="#7d8590" font-size="11">nothing happens onchain until [confirm]</text>

  <!-- arrow 3 to 4 -->
  <line x1="500" y1="332" x2="500" y2="360" stroke="#484f58" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="522" y="351" fill="#7d8590" font-size="11">[confirm]</text>

  <!-- BOX 4: execute -->
  <rect x="350" y="363" width="300" height="98" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="500" y="388" text-anchor="middle" fill="#e6edf3" font-size="14">execute</text>
  <text x="500" y="408" text-anchor="middle" fill="#7d8590" font-size="11">balance check</text>
  <text x="500" y="426" text-anchor="middle" fill="#7d8590" font-size="11">approve tx  →  poll</text>
  <text x="500" y="444" text-anchor="middle" fill="#7d8590" font-size="11">pay tx  →  poll</text>

  <!-- circle api annotation -->
  <line x1="650" y1="412" x2="696" y2="412" stroke="#484f58" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="699" y="363" width="296" height="98" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="847" y="396" text-anchor="middle" fill="#e6edf3" font-size="13">circle developer-controlled</text>
  <text x="847" y="415" text-anchor="middle" fill="#e6edf3" font-size="13">wallet api</text>
  <text x="847" y="440" text-anchor="middle" fill="#7d8590" font-size="11">mpc  ·  no private key exposure</text>

  <!-- arrow 4 to 5 (green) -->
  <line x1="500" y1="461" x2="500" y2="492" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="522" y="481" fill="#7d8590" font-size="11">COMPLETE</text>

  <!-- BOX 5: complete (green accent) -->
  <rect x="350" y="495" width="300" height="66" rx="6" fill="#0d2b1a" stroke="#3fb950" stroke-width="1.5"/>
  <text x="500" y="521" text-anchor="middle" fill="#e6edf3" font-size="14">complete</text>
  <text x="500" y="542" text-anchor="middle" fill="#7d8590" font-size="11">log payment  ·  update vendor stats  ·  notify</text>

  <!-- bottom label -->
  <text x="600" y="608" text-anchor="middle" fill="#30363d" font-size="12">@ArcPayAgent  ·  github.com/dnebayis/ArcPayAgent</text>
</svg>
