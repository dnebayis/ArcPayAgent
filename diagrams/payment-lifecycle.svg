<svg width="1200" height="520" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', Courier, monospace">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#484f58"/>
    </marker>
    <marker id="arr-g" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#238636"/>
    </marker>
    <marker id="arr-r" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#da3633"/>
    </marker>
    <marker id="arr-b" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1f6feb"/>
    </marker>
  </defs>

  <rect width="1200" height="520" fill="#0d1117"/>
  <rect width="1200" height="3" fill="#388bfd"/>

  <text x="600" y="36" text-anchor="middle" fill="#e6edf3" font-size="16">payment lifecycle</text>

  <!-- STEP 1: user -->
  <rect x="460" y="55" width="280" height="50" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="600" y="78" text-anchor="middle" fill="#8b949e" font-size="11">1</text>
  <text x="600" y="95" text-anchor="middle" fill="#e6edf3" font-size="13">"send 5 USDC to jack"</text>

  <line x1="600" y1="105" x2="600" y2="126" stroke="#484f58" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- STEP 2: orchestrator → create_payment (SILENT) -->
  <rect x="460" y="129" width="280" height="50" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="600" y="152" text-anchor="middle" fill="#8b949e" font-size="11">2  ·  SILENT ACTION</text>
  <text x="600" y="169" text-anchor="middle" fill="#e6edf3" font-size="13">create_payment</text>

  <line x1="600" y1="179" x2="600" y2="200" stroke="#484f58" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- STEP 3: PaymentEngine.prepare() -->
  <rect x="460" y="203" width="280" height="50" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="600" y="226" text-anchor="middle" fill="#8b949e" font-size="11">3</text>
  <text x="600" y="243" text-anchor="middle" fill="#e6edf3" font-size="13">PaymentEngine.prepare()</text>

  <line x1="600" y1="253" x2="600" y2="274" stroke="#484f58" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- STEP 4: Review card -->
  <rect x="460" y="277" width="280" height="50" rx="6" fill="#0d2137" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="600" y="300" text-anchor="middle" fill="#8b949e" font-size="11">4</text>
  <text x="600" y="317" text-anchor="middle" fill="#58a6ff" font-size="13">Review Card  [Confirm]  [Cancel]</text>

  <!-- CONFIRM branch -->
  <line x1="530" y1="327" x2="450" y2="352" stroke="#238636" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="460" y="348" fill="#3fb950" font-size="11">confirm</text>

  <!-- CANCEL branch -->
  <line x1="670" y1="327" x2="750" y2="352" stroke="#da3633" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <text x="720" y="348" fill="#f85149" font-size="11">cancel</text>

  <!-- CONFIRM path -->
  <rect x="60" y="355" width="280" height="50" rx="6" fill="#0a1f0a" stroke="#238636" stroke-width="1.5"/>
  <text x="200" y="378" text-anchor="middle" fill="#8b949e" font-size="11">5a</text>
  <text x="200" y="395" text-anchor="middle" fill="#3fb950" font-size="13">Circle approve TX</text>

  <line x1="200" y1="405" x2="200" y2="426" stroke="#238636" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <rect x="60" y="429" width="280" height="50" rx="6" fill="#0a1f0a" stroke="#238636" stroke-width="1.5"/>
  <text x="200" y="452" text-anchor="middle" fill="#8b949e" font-size="11">5b</text>
  <text x="200" y="469" text-anchor="middle" fill="#3fb950" font-size="13">Circle pay TX  →  poll  →  ✓</text>

  <!-- CANCEL path -->
  <rect x="860" y="355" width="280" height="50" rx="6" fill="#1a0a0a" stroke="#da3633" stroke-width="1.5"/>
  <text x="1000" y="378" text-anchor="middle" fill="#8b949e" font-size="11">5c</text>
  <text x="1000" y="395" text-anchor="middle" fill="#f85149" font-size="13">clear pending  ·  reset FlowState</text>

  <!-- STEP 6: payment log (only for confirm) -->
  <line x1="200" y1="479" x2="200" y2="492" stroke="#238636" stroke-width="1.5"/>
  <line x1="200" y1="492" x2="460" y2="492" stroke="#238636" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <rect x="460" y="467" width="280" height="42" rx="6" fill="#0a1f0a" stroke="#238636" stroke-width="1.5"/>
  <text x="600" y="492" text-anchor="middle" fill="#3fb950" font-size="13">payment_logs  ·  success message</text>

  <!-- bottom label -->
  <text x="600" y="512" text-anchor="middle" fill="#30363d" font-size="12">@ArcPayAgent  ·  Arc Testnet</text>
</svg>
