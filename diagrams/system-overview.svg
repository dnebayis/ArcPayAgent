<svg width="1200" height="560" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', Courier, monospace">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#484f58"/>
    </marker>
    <marker id="arr-g" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#238636"/>
    </marker>
    <marker id="arr-b" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1f6feb"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1200" height="560" fill="#0d1117"/>
  <rect width="1200" height="3" fill="#388bfd"/>

  <!-- title -->
  <text x="600" y="36" text-anchor="middle" fill="#e6edf3" font-size="16">system architecture</text>

  <!-- ─── LAYER 1: TELEGRAM ─── -->
  <rect x="180" y="55" width="660" height="54" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="510" y="78" text-anchor="middle" fill="#8b949e" font-size="11">TELEGRAM LAYER</text>
  <text x="300" y="97" text-anchor="middle" fill="#e6edf3" font-size="12">bot.ts</text>
  <text x="510" y="97" text-anchor="middle" fill="#e6edf3" font-size="12">messages.ts</text>
  <text x="720" y="97" text-anchor="middle" fill="#e6edf3" font-size="12">callbacks.ts</text>
  <line x1="380" y1="70" x2="380" y2="100" stroke="#30363d" stroke-width="1"/>
  <line x1="620" y1="70" x2="620" y2="100" stroke="#30363d" stroke-width="1"/>

  <!-- arrow 1→2 -->
  <line x1="510" y1="109" x2="510" y2="130" stroke="#484f58" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ─── LAYER 2: CORE ─── -->
  <rect x="180" y="133" width="660" height="54" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="510" y="156" text-anchor="middle" fill="#8b949e" font-size="11">CORE LAYER</text>
  <text x="300" y="175" text-anchor="middle" fill="#e6edf3" font-size="12">orchestrator.ts</text>
  <text x="510" y="175" text-anchor="middle" fill="#e6edf3" font-size="12">sender.ts</text>
  <text x="720" y="175" text-anchor="middle" fill="#e6edf3" font-size="12">state.ts</text>
  <line x1="400" y1="148" x2="400" y2="178" stroke="#30363d" stroke-width="1"/>
  <line x1="620" y1="148" x2="620" y2="178" stroke="#30363d" stroke-width="1"/>

  <!-- LLM side box -->
  <line x1="840" y1="160" x2="885" y2="160" stroke="#1f6feb" stroke-width="1.5" marker-end="url(#arr-b)"/>
  <rect x="888" y="133" width="280" height="54" rx="6" fill="#0d2137" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="1028" y="156" text-anchor="middle" fill="#8b949e" font-size="11">LLM LAYER</text>
  <text x="960" y="175" text-anchor="middle" fill="#58a6ff" font-size="12">client.ts</text>
  <text x="1028" y="175" text-anchor="middle" fill="#58a6ff" font-size="12">prompt.ts</text>
  <text x="1100" y="175" text-anchor="middle" fill="#58a6ff" font-size="12">tools.ts</text>
  <line x1="1000" y1="148" x2="1000" y2="178" stroke="#1f6feb" stroke-width="0.8" stroke-opacity="0.4"/>
  <line x1="1060" y1="148" x2="1060" y2="178" stroke="#1f6feb" stroke-width="0.8" stroke-opacity="0.4"/>

  <!-- arrow 2→3 -->
  <line x1="510" y1="187" x2="510" y2="208" stroke="#484f58" stroke-width="1.5" marker-end="url(#arr)"/>

