  <rect x="180" y="211" width="660" height="54" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="510" y="234" text-anchor="middle" fill="#8b949e" font-size="11">ACTION LAYER</text>
  <text x="280" y="253" text-anchor="middle" fill="#e6edf3" font-size="12">registry.ts</text>
  <text x="430" y="253" text-anchor="middle" fill="#e6edf3" font-size="12">schemas.ts</text>
  <text x="580" y="253" text-anchor="middle" fill="#e6edf3" font-size="12">payment.ts</text>
  <text x="720" y="253" text-anchor="middle" fill="#e6edf3" font-size="12">vendor.ts  wallet.ts  ...</text>
  <line x1="350" y1="226" x2="350" y2="256" stroke="#30363d" stroke-width="1"/>
  <line x1="500" y1="226" x2="500" y2="256" stroke="#30363d" stroke-width="1"/>
  <line x1="650" y1="226" x2="650" y2="256" stroke="#30363d" stroke-width="1"/>

  <!-- arrow 3→4 -->
  <line x1="510" y1="265" x2="510" y2="286" stroke="#484f58" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ─── LAYER 4: ENGINES ─── -->
  <rect x="180" y="289" width="660" height="54" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="510" y="312" text-anchor="middle" fill="#8b949e" font-size="11">ENGINE LAYER</text>
  <text x="280" y="331" text-anchor="middle" fill="#e6edf3" font-size="12">payment.ts</text>
  <text x="430" y="331" text-anchor="middle" fill="#e6edf3" font-size="12">invoice.ts</text>
  <text x="580" y="331" text-anchor="middle" fill="#e6edf3" font-size="12">analytics.ts</text>
  <text x="730" y="331" text-anchor="middle" fill="#e6edf3" font-size="12">requests.ts  identity.ts</text>
  <line x1="350" y1="304" x2="350" y2="334" stroke="#30363d" stroke-width="1"/>
  <line x1="500" y1="304" x2="500" y2="334" stroke="#30363d" stroke-width="1"/>
  <line x1="650" y1="304" x2="650" y2="334" stroke="#30363d" stroke-width="1"/>

  <!-- Background services side box -->
  <line x1="840" y1="316" x2="885" y2="316" stroke="#238636" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <rect x="888" y="289" width="280" height="54" rx="6" fill="#0a1f0a" stroke="#238636" stroke-width="1.5"/>
  <text x="1028" y="312" text-anchor="middle" fill="#8b949e" font-size="11">BACKGROUND SERVICES</text>
  <text x="960" y="331" text-anchor="middle" fill="#3fb950" font-size="12">scheduler</text>
  <text x="1028" y="331" text-anchor="middle" fill="#3fb950" font-size="12">watcher</text>
  <text x="1096" y="331" text-anchor="middle" fill="#3fb950" font-size="12">alerter</text>
  <line x1="1000" y1="304" x2="1000" y2="334" stroke="#238636" stroke-width="0.8" stroke-opacity="0.4"/>
  <line x1="1060" y1="304" x2="1060" y2="334" stroke="#238636" stroke-width="0.8" stroke-opacity="0.4"/>

  <!-- arrow 4→5 -->
  <line x1="510" y1="343" x2="510" y2="364" stroke="#484f58" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ─── LAYER 5: CHAIN ─── -->
  <rect x="180" y="367" width="660" height="54" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="510" y="390" text-anchor="middle" fill="#8b949e" font-size="11">CHAIN LAYER</text>
  <text x="300" y="409" text-anchor="middle" fill="#e6edf3" font-size="12">circle.ts</text>
  <text x="510" y="409" text-anchor="middle" fill="#e6edf3" font-size="12">router.ts</text>
  <text x="720" y="409" text-anchor="middle" fill="#e6edf3" font-size="12">tokens.ts  erc8004.ts</text>
  <line x1="400" y1="382" x2="400" y2="412" stroke="#30363d" stroke-width="1"/>
  <line x1="620" y1="382" x2="620" y2="412" stroke="#30363d" stroke-width="1"/>

  <!-- arrow 5→6 -->
  <line x1="510" y1="421" x2="510" y2="442" stroke="#484f58" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ─── LAYER 6: STORE ─── -->
  <rect x="180" y="445" width="660" height="54" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="510" y="468" text-anchor="middle" fill="#8b949e" font-size="11">STORE LAYER  ·  13 tables  ·  SQLite / PostgreSQL</text>
  <text x="300" y="487" text-anchor="middle" fill="#e6edf3" font-size="12">wallets  vendors  payments</text>
  <text x="570" y="487" text-anchor="middle" fill="#e6edf3" font-size="12">schedules  alerts  watch</text>
  <text x="790" y="487" text-anchor="middle" fill="#e6edf3" font-size="12">keys  identity  ...</text>
  <line x1="430" y1="460" x2="430" y2="490" stroke="#30363d" stroke-width="1"/>
  <line x1="670" y1="460" x2="670" y2="490" stroke="#30363d" stroke-width="1"/>

  <!-- bottom label -->
  <text x="600" y="536" text-anchor="middle" fill="#30363d" font-size="12">@ArcPayAgent  ·  Arc Testnet</text>
</svg>
