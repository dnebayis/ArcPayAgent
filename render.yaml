services:
  - type: web
    name: arcpay-agent
    runtime: node
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TZ
        value: Europe/Istanbul
      - key: ARC_RPC_URL
        value: https://rpc.testnet.arc.network
      - key: CIRCLE_API_URL
        value: https://api.circle.com/v1/w3s
      - key: TELEGRAM_TOKEN
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: PAYABLES_ROUTER_ADDRESS
        sync: false
      - key: USDC_ADDRESS
        sync: false
      - key: LLM_KEY_SECRET
        sync: false
      - key: CIRCLE_API_KEY
        sync: false
      - key: CIRCLE_ENTITY_SECRET
        sync: false
      - key: CIRCLE_WALLET_SET_ID
        sync: false
      - key: ARC_GAS_RESERVE_USDC
        sync: false
      - key: PAYMENT_HISTORY_SOURCE
        sync: false
      - key: PAYMENT_HISTORY_CHUNK
        sync: false
      - key: PAYMENT_HISTORY_WINDOWS
        sync: false
      - key: CIRCLE_TX_POLL_ATTEMPTS
        sync: false
      - key: CIRCLE_TX_POLL_INTERVAL_MS
        sync: false
      - key: LOG_INTENT
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ARC_AGENT_METADATA_URI
        sync: false
      - key: ARC_AGENT_ID
        sync: false
      - key: ARC_AGENT_OWNER_WALLET_ID
        sync: false
      - key: ARC_AGENT_VALIDATOR_WALLET_ID
        sync: false
      - key: ARC_AGENT_WALLET_SET_NAME
        sync: false
      - key: ERC8004_IDENTITY_REGISTRY_ADDRESS
        sync: false
      - key: ERC8004_REPUTATION_REGISTRY_ADDRESS
        sync: false
      - key: ERC8004_VALIDATION_REGISTRY_ADDRESS
        sync: false
