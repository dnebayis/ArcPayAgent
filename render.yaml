services:
  - type: worker
    name: arcpay-agent
    runtime: node
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: node dist/index.js
    disk:
      name: arcpay-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TZ
        value: Europe/Istanbul
      - key: ARC_RPC_URL
        value: https://rpc.testnet.arc.network
      - key: CIRCLE_API_URL
        value: https://api.circle.com/v1/w3s
      - key: TELEGRAM_TOKEN
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: PAYABLES_ROUTER_ADDRESS
        sync: false
      - key: USDC_ADDRESS
        sync: false
      - key: LLM_KEY_SECRET
        sync: false
      - key: WALLET_SECRET
        sync: false
      - key: CIRCLE_API_KEY
        sync: false
      - key: CIRCLE_ENTITY_SECRET
        sync: false
      - key: CIRCLE_WALLET_SET_ID
        sync: false
      - key: PAYMENT_HISTORY_SOURCE
        sync: false
      - key: PAYMENT_HISTORY_CHUNK
        sync: false
      - key: PAYMENT_HISTORY_WINDOWS
        sync: false
      - key: LOG_INTENT
        sync: false
